server {
    listen 80;

    # вбудований DNS Docker, щоб бачити нові репліки app
    resolver 127.0.0.11 valid=2s;

    location / {
        # змінна змушує nginx резолвити ім'я на кожен запит
        set $upstream http://app:8000;
        proxy_pass $upstream;
        proxy_set_header Host $host;
    }
}
